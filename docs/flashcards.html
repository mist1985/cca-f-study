  <p class="hint">Tap the card to flip it. Got it → it's gone. Again → it comes back later.</p>
  <div class="filters"><button class="fchip on" data-area="all" style="--a:#e9e7e2">All</button><button class="fchip" data-area="D1" style="--a:#a78bfa">🤖 Agents</button><button class="fchip" data-area="D2" style="--a:#22d3ee">🧰 Tools &amp; MCP</button><button class="fchip" data-area="D3" style="--a:#4ade80">💻 Claude Code</button><button class="fchip" data-area="D4" style="--a:#fbbf24">🎯 Reliable answers</button><button class="fchip" data-area="D5" style="--a:#f472b6">⏳ Over time</button></div>

<script>window.CARDS=[{"q": "how does the loop know Claude is finished?", "a": "<p><code>stop_reason</code> is <code>&quot;end_turn&quot;</code>. Not its words, not a step count, not the presence of text.</p>", "area": "D1", "from": "1.1 · The loop", "href": "layer3_details/D1_agents/1.1_the_loop.html", "type": "recall"}, {"q": "every helper did its job well, but the report misses half the topic. Why?", "a": "<p>The lead split the topic too narrowly. The problem is <em>what</em> the helpers were given, not how they did it.</p>", "area": "D1", "from": "1.2 · Lead + helpers (coordinator & subagents)", "href": "layer3_details/D1_agents/1.2_lead_and_helpers.html", "type": "recall"}, {"q": "how do you make 3 helpers run at the same time?", "a": "<p>The lead sends 3 Task calls in one single reply.</p>", "area": "D1", "from": "1.3 · Briefing helpers (subagent setup)", "href": "layer3_details/D1_agents/1.3_briefing_helpers.html", "type": "recall"}, {"q": "12% of the time the agent skips identity checks. Best fix?", "a": "<p>A code-level prerequisite that blocks the order/refund tools until a verified customer ID exists.</p>", "area": "D1", "from": "1.4 · Unbreakable rules + handing over to a human", "href": "layer3_details/D1_agents/1.4_unbreakable_rules.html", "type": "recall"}, {"q": "3 MCP tools return dates in 3 formats. Fix?", "a": "<p>A PostToolUse hook converts them all to one format before Claude reads them.</p>", "area": "D1", "from": "1.5 · Hooks: the two guards", "href": "layer3_details/D1_agents/1.5_hooks.html", "type": "recall"}, {"q": "a 14-file review is inconsistent and contradicts itself. Fix?", "a": "<p>Review each file on its own, then one extra pass for how the files connect.</p>", "area": "D1", "from": "1.6 · Splitting a job", "href": "layer3_details/D1_agents/1.6_splitting_a_job.html", "type": "recall"}, {"q": "when is a fresh start better than resume?", "a": "<p>When the old tool results are stale (the files changed). Start fresh and pass in a structured summary.</p>", "area": "D1", "from": "1.7 · Sessions: resume & fork", "href": "layer3_details/D1_agents/1.7_sessions.html", "type": "recall"}, {"q": "Claude keeps calling the customer tool for order questions. First fix?", "a": "<p>Expand both tool descriptions: inputs, example queries, edge cases, when to use which.</p>", "area": "D2", "from": "2.1 · Tool descriptions", "href": "layer3_details/D2_tools/2.1_descriptions.html", "type": "recall"}, {"q": "why is returning [] on a timeout dangerous?", "a": "<p>Claude reads it as \"nothing exists\" and gives a confident wrong answer.</p>", "area": "D2", "from": "2.2 · Error messages", "href": "layer3_details/D2_tools/2.2_errors.html", "type": "recall"}, {"q": "which setting makes one specific tool run first?", "a": "<p><code>tool_choice: {&quot;type&quot;: &quot;tool&quot;, &quot;name&quot;: &quot;...&quot;}</code> (forced selection).</p>", "area": "D2", "from": "2.3 · Who gets which tools + tool_choice", "href": "layer3_details/D2_tools/2.3_who_gets_which_tools.html", "type": "recall"}, {"q": "how does the team share a server without sharing a password?", "a": "<p>Commit <code>.mcp.json</code> with <code>${TOKEN}</code> placeholders. Each person sets their own environment variable.</p>", "area": "D2", "from": "2.4 · MCP for a team", "href": "layer3_details/D2_tools/2.4_mcp_for_a_team.html", "type": "recall"}, {"q": "Edit says \"text not unique\". Exam answer?", "a": "<p>Read the full file, then Write the corrected version.</p>", "area": "D2", "from": "2.5 · Built-in tools", "href": "layer3_details/D2_tools/2.5_built_in_tools.html", "type": "recall"}, {"q": "a new developer's Claude ignores the team style. Why?", "a": "<p>The style rules sit in someone's user-level file, which isn't shared through git.</p>", "area": "D3", "from": "3.1 · CLAUDE.md: the note on Claude's desk", "href": "layer3_details/D3_claude_code/3.1_claude_md.html", "type": "recall"}, {"q": "a skill dumps 500 lines of analysis into your chat. Fix?", "a": "<p>Add <code>context: fork</code> so it runs in an isolated helper.</p>", "area": "D3", "from": "3.2 · Slash commands & skills", "href": "layer3_details/D3_claude_code/3.2_commands_and_skills.html", "type": "recall"}, {"q": "test files live next to their code in 50 folders. Where do test conventions go?", "a": "<p>One <code>.claude/rules/</code> file with <code>paths: [&quot;**/*.test.tsx&quot;]</code>.</p>", "area": "D3", "from": "3.3 · Path-specific rules", "href": "layer3_details/D3_claude_code/3.3_path_rules.html", "type": "recall"}, {"q": "give one example for each mode.", "a": "<p>Plan: microservices restructuring. Direct: single-file fix with a clear stack trace.</p>", "area": "D3", "from": "3.4 · Plan mode vs just doing it", "href": "layer3_details/D3_claude_code/3.4_plan_mode.html", "type": "recall"}, {"q": "when do you send all issues together?", "a": "<p>When the fixes interact. Independent issues get fixed one by one.</p>", "area": "D3", "from": "3.5 · Iterative refinement", "href": "layer3_details/D3_claude_code/3.5_refining.html", "type": "recall"}, {"q": "the CI job hangs forever. Fix?", "a": "<p>Add <code>-p</code>.</p>", "area": "D3", "from": "3.6 · Claude Code in CI/CD", "href": "layer3_details/D3_claude_code/3.6_ci_cd.html", "type": "recall"}, {"q": "why doesn't \"only high-confidence findings\" work?", "a": "<p>It gives Claude no clear line to decide by. Exact categories do.</p>", "area": "D4", "from": "4.1 · Exact rules beat \"be careful\"", "href": "layer3_details/D4_reliable_answers/4.1_exact_rules.html", "type": "recall"}, {"q": "how many examples, and of what?", "a": "<p>2–4, targeted at the ambiguous cases, showing the reasoning for the choice.</p>", "area": "D4", "from": "4.2 · Few-shot examples", "href": "layer3_details/D4_reliable_answers/4.2_examples_few_shot.html", "type": "recall"}, {"q": "why make a field nullable?", "a": "<p>If the document doesn't have it, Claude can say null instead of making something up.</p>", "area": "D4", "from": "4.3 · Forced format (tool use + JSON schema)", "href": "layer3_details/D4_reliable_answers/4.3_forced_format.html", "type": "recall"}, {"q": "when will a retry NOT help?", "a": "<p>When the information isn't in the document Claude was given.</p>", "area": "D4", "from": "4.4 · Check + retry", "href": "layer3_details/D4_reliable_answers/4.4_check_and_retry.html", "type": "recall"}, {"q": "why not batch the pre-merge check?", "a": "<p>Developers are waiting, and batch has no guaranteed time (up to 24 h).</p>", "area": "D4", "from": "4.5 · Message Batches API", "href": "layer3_details/D4_reliable_answers/4.5_batch_api.html", "type": "recall"}, {"q": "why doesn't more thinking fix self-review?", "a": "<p>It's still the same context with the same bias. A fresh instance doesn't have it.</p>", "area": "D4", "from": "4.6 · Fresh reviewer, multiple passes", "href": "layer3_details/D4_reliable_answers/4.6_fresh_reviewer.html", "type": "recall"}, {"q": "where do the exact amounts and order numbers live?", "a": "<p>In a persistent case facts block, outside the summarized history, included in every prompt.</p>", "area": "D5", "from": "5.1 · Keeping exact facts in long conversations", "href": "layer3_details/D5_over_time/5.1_keep_exact_facts.html", "type": "recall"}, {"q": "name the 3 triggers.", "a": "<p>Customer asks · policy gap · can't make progress.</p>", "area": "D5", "from": "5.2 · When to call a human", "href": "layer3_details/D5_over_time/5.2_when_to_call_a_human.html", "type": "recall"}, {"q": "what goes into a good error from a helper?", "a": "<p>Failure type, what it tried, partial results, possible alternatives.</p>", "area": "D5", "from": "5.3 · Reporting failures honestly (multi-agent)", "href": "layer3_details/D5_over_time/5.3_honest_failures.html", "type": "recall"}, {"q": "how does a crashed multi-agent job continue?", "a": "<p>Each agent wrote its state to a manifest. The lead loads it and injects it into the prompts.</p>", "area": "D5", "from": "5.4 · Context in big codebases", "href": "layer3_details/D5_over_time/5.4_big_codebases.html", "type": "recall"}, {"q": "why sample high-confidence items?", "a": "<p>To catch new error types in the part nobody reviews any more.</p>", "area": "D5", "from": "5.5 · Human review & confidence", "href": "layer3_details/D5_over_time/5.5_human_checks.html", "type": "recall"}, {"q": "two reports give different market sizes. What do you do?", "a": "<p>Keep both with their source and date, mark it as a conflict, and let the lead reconcile.</p>", "area": "D5", "from": "5.6 · Sources & conflicting facts (provenance)", "href": "layer3_details/D5_over_time/5.6_sources_and_conflicts.html", "type": "recall"}, {"q": "<p><strong>Q1 · Customer support.</strong> The agent sometimes refunds over $500 without approval. The system prompt already forbids it. Best fix?<br>A) Repeat the rule in capital letters at the top of the prompt<br>B) A hook that blocks refunds above $500 and sends the case to human escalation<br>C) Few-shot examples of refusing large refunds<br>D) Lower the temperature</p>", "a": "<p>B. A rule that must hold every time goes in code. → card 1.5</p>", "area": "D1", "from": "Practice question", "href": "layer4_practice/2_practice_questions.html", "type": "exam"}, {"q": "<p><strong>Q2 · Customer support.</strong> A customer writes: \"I want to talk to a real person.\" The issue looks easy to solve. What should the agent do?<br>A) Solve it quickly first, then offer a human<br>B) Escalate to a human immediately<br>C) Ask why they want a human<br>D) Check sentiment, and escalate only if it's negative</p>", "a": "<p>B. An explicit request means escalate immediately, with no investigating first. → card 5.2</p>", "area": "D5", "from": "Practice question", "href": "layer4_practice/2_practice_questions.html", "type": "exam"}, {"q": "<p><strong>Q3 · Customer support.</strong> <code>get_customer</code> returns 3 customers named \"Ana Petrova\". What next?<br>A) Pick the one with the most recent order<br>B) Pick the one with the most activity<br>C) Ask the customer for another identifier, like email or order number<br>D) Escalate to a human</p>", "a": "<p>C. Never guess. Ask for more identifiers. → card 5.2</p>", "area": "D5", "from": "Practice question", "href": "layer4_practice/2_practice_questions.html", "type": "exam"}, {"q": "<p><strong>Q4 · Multi-agent research.</strong> The synthesis subagent writes reports without key facts that the web-search subagent found. What's most likely wrong?<br>A) The synthesis agent needs a bigger context window<br>B) The coordinator isn't putting the search results into the synthesis agent's prompt<br>C) Subagents should share memory<br>D) The search agent should send results to synthesis directly</p>", "a": "<p>B. Subagents only know what's in their prompt. → card 1.3</p>", "area": "D1", "from": "Practice question", "href": "layer4_practice/2_practice_questions.html", "type": "exam"}, {"q": "<p><strong>Q5 · Multi-agent research.</strong> Three subagents run one after another, and it's slow. They don't depend on each other. Fix?<br>A) Have the coordinator emit 3 Task calls in one response<br>B) Use a faster model<br>C) Merge all three into one subagent<br>D) Use the Batch API</p>", "a": "<p>A. Several Task calls in one reply run in parallel. → card 1.3</p>", "area": "D1", "from": "Practice question", "href": "layer4_practice/2_practice_questions.html", "type": "exam"}, {"q": "<p><strong>Q6 · Multi-agent research.</strong> Source A says the market is $2.1B (2023). Source B says $2.8B (2025). How should the report handle this?<br>A) Use B, because it's newer<br>B) Average them<br>C) Include both with source and date, noted as different<br>D) Leave the number out</p>", "a": "<p>C. Attribute both and keep the dates. The years may explain the gap. → card 5.6</p>", "area": "D5", "from": "Practice question", "href": "layer4_practice/2_practice_questions.html", "type": "exam"}, {"q": "<p><strong>Q7 · Claude Code.</strong> A developer wants their own version of the team's <code>/review</code> skill without affecting teammates. Where?<br>A) Edit <code>.claude/skills/review/</code> in the repo<br>B) <code>~/.claude/skills/</code> with a <strong>different name</strong><br>C) In their CLAUDE.md<br>D) In <code>.mcp.json</code></p>", "a": "<p>B. Personal variant: user scope, different name. → card 3.2</p>", "area": "D3", "from": "Practice question", "href": "layer4_practice/2_practice_questions.html", "type": "exam"}, {"q": "<p><strong>Q8 · Claude Code.</strong> Terraform files need special conventions, and they only live under <code>terraform/</code>. Most maintainable?<br>A) A <code>.claude/rules/</code> file with <code>paths: [&quot;terraform/**/*&quot;]</code><br>B) A section in root CLAUDE.md<br>C) A skill the developer runs each time<br>D) Paste the conventions into every prompt</p>", "a": "<p>A. A path-scoped rule loads automatically when matching files are edited. → card 3.3</p>", "area": "D3", "from": "Practice question", "href": "layer4_practice/2_practice_questions.html", "type": "exam"}, {"q": "<p><strong>Q9 · CI/CD.</strong> After a developer pushes fixes, the re-review posts the same 12 comments again. Fix?<br>A) Turn off re-reviews<br>B) Include the earlier findings and ask Claude to report only new or still-unresolved issues<br>C) Use a larger model<br>D) Delete the old comments before every run</p>", "a": "<p>B. → card 3.6</p>", "area": "D3", "from": "Practice question", "href": "layer4_practice/2_practice_questions.html", "type": "exam"}, {"q": "<p><strong>Q10 · CI/CD.</strong> The test generator keeps suggesting tests that already exist. Best two fixes? <em>(choose 2)</em><br>A) Give it the existing test files in context<br>B) Document testing standards and the available fixtures in CLAUDE.md<br>C) Raise the temperature<br>D) Run it through the Batch API<br>E) Tell it \"don't duplicate tests\"</p>", "a": "<p>A and B. E is vague, and Claude can't avoid duplicates it can't see. → card 3.6</p>", "area": "D3", "from": "Practice question", "href": "layer4_practice/2_practice_questions.html", "type": "exam"}, {"q": "<p><strong>Q11 · Data extraction.</strong> Some invoices have no PO number, and the model invents one. Best schema fix?<br>A) Make <code>po_number</code> required<br>B) Make <code>po_number</code> nullable / optional<br>C) Retry until it's found<br>D) Add \"do not invent\" to the prompt</p>", "a": "<p>B. Required fields push Claude to make values up. → card 4.3</p>", "area": "D4", "from": "Practice question", "href": "layer4_practice/2_practice_questions.html", "type": "exam"}, {"q": "<p><strong>Q12 · Data extraction.</strong> Extracted line items don't add up to the stated total. The JSON is valid. Best design?<br>A) Trust it, because the schema passed<br>B) Extract <code>calculated_total</code> and <code>stated_total</code>, flag <code>conflict_detected</code>, and retry with the specific error when it's an extraction mistake<br>C) Switch to few-shot instead of a schema<br>D) Drop the total field</p>", "a": "<p>B. A schema means shape, not truth. Validate the meaning yourself. → cards 4.3 + 4.4</p>", "area": "L4", "from": "Practice question", "href": "layer4_practice/2_practice_questions.html", "type": "exam"}, {"q": "<p><strong>Q13 · Data extraction.</strong> You must return results within 30 hours, and batch processing can take up to 24 hours. How often do you submit batches?<br>A) Once a day<br>B) Every 4 hours<br>C) Every 12 hours<br>D) Batching can't meet any SLA</p>", "a": "<p>B. Up to 4 h waiting + 24 h processing = 28 h ≤ 30 h. → card 4.5</p>", "area": "D4", "from": "Practice question", "href": "layer4_practice/2_practice_questions.html", "type": "exam"}, {"q": "<p><strong>Q14 · Data extraction.</strong> Accuracy is 97% overall. Leadership wants to remove human review. First step?<br>A) Remove it, since 97% is great<br>B) Measure accuracy by document type and field on a labeled set<br>C) Keep review only for low-confidence items<br>D) Ask the model how confident it is overall</p>", "a": "<p>B. → card 5.5</p>", "area": "D5", "from": "Practice question", "href": "layer4_practice/2_practice_questions.html", "type": "exam"}, {"q": "<p><strong>Q15 · Developer productivity.</strong> The agent uses built-in Grep instead of your more capable MCP code-search tool. Fix?<br>A) Remove Grep<br>B) Improve the MCP tool's description: its capabilities and outputs<br>C) Force the MCP tool with <code>tool_choice</code><br>D) Add \"prefer MCP\" to CLAUDE.md</p>", "a": "<p>B. Fix the cause: the description. → card 2.4</p>", "area": "D2", "from": "Practice question", "href": "layer4_practice/2_practice_questions.html", "type": "exam"}, {"q": "<p><strong>Q16 · Developer productivity.</strong> A long codebase exploration starts giving vague \"typical pattern\" answers. Best two? <em>(choose 2)</em><br>A) Keep a scratchpad file of key findings and refer back to it<br>B) Give specific questions to subagents (e.g. \"trace the refund flow\")<br>C) Start over and re-read every file<br>D) Switch to a model with a bigger window</p>", "a": "<p>A and B. → card 5.4</p>", "area": "D5", "from": "Practice question", "href": "layer4_practice/2_practice_questions.html", "type": "exam"}];</script>
